# DELIBERATELY INSECURE - Aikido IaC scanning demo.
apiVersion: v1
kind: Service
metadata:
  name: web-public
  namespace: default
spec:
  type: LoadBalancer            # publicly exposed
  loadBalancerSourceRanges: ["0.0.0.0/0"]
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
  namespace: default
spec:
  type: NodePort
  selector: {app: web}
  ports:
    - port: 8080
      nodePort: 30080
---
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: default
type: Opaque
stringData:
  username: admin
  password: Password123!        # plaintext secret committed to git
  api-key: sk_live_EXAMPLEEXAMPLEEXAMPLE00
