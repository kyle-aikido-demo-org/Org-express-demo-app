# DELIBERATELY INSECURE - Aikido IaC scanning demo.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: god-mode
rules:
  - apiGroups: ["*"]
    resources: ["*"]            # wildcard resources
    verbs: ["*"]                # wildcard verbs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-reader-exec
rules:
  - apiGroups: [""]
    resources: ["secrets"]      # read all secrets
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods"]
    verbs: ["create", "get"]    # exec into / create pods
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: default-sa-cluster-admin
subjects:
  - kind: ServiceAccount
    name: default               # default service account
    namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin           # cluster-admin binding
  apiGroup: rbac.authorization.k8s.io
